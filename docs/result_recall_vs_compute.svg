<text x="28" y="57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#52514E">Qwen3.8-27B, bf16, A100 80&#160;GB. The energy bars cover the WHOLE run: building the diagram once, plus reading it for all 96 questions.</text>
<text x="28" y="75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#52514E">The diagram rows saw no verbatim transcript at all.</text>
