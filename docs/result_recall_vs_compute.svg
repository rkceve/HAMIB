<svg xmlns="http://www.w3.org/2000/svg" width="960" height="352" viewBox="0 0 960 352" role="img" aria-label="Fact recall and total energy for a 96-question run. The full transcript answers 94 of 96 using 6.28 megajoules. The 32k correlation-diagram window answers 63 using 0.99 megajoules, of which 0.69 is the one-time cost of building the diagram.">
