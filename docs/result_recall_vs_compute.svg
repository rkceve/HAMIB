<line x1="196" y1="308" x2="396" y2="308" stroke="#E1E0D9" stroke-width="1"/>
<line x1="524" y1="308" x2="752" y2="308" stroke="#E1E0D9" stroke-width="1"/>
<line x1="28" y1="328" x2="932" y2="328" stroke="#E1E0D9" stroke-width="1"/>
<text x="28" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" fill="#52514E">Building the diagram cost 1&#160;h&#160;45&#160;min and 0.69&#160;MJ, once for the whole session, and it is most of every blue bar above.</text>
<text x="28" y="365" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" fill="#52514E">It does not grow with the number of questions: below 11 questions the diagram arm loses, at 1,000 the saving reaches 17x.</text>
<text x="28" y="382" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" fill="#52514E">The judge that routed the build ran on a hosted API, so its energy is not in these bars.</text>
</svg>