<rect x="524.0" y="132" width="228.0" height="15" rx="3" fill="#8A887F"/>
<text x="761.0" y="144" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">6.28 MJ<tspan font-weight="400" fill="#898781"></tspan></text>
