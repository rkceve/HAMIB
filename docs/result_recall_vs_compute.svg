<text x="28" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" fill="#52514E">Building the diagram cost 1&#160;h&#160;45&#160;min and 0.69&#160;MJ, once for the whole session. It is most of every blue bar above, and it does not grow with the number of questions:</text>
<text x="28" y="349" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12" fill="#52514E">break-even against the baseline is 11 questions, and at 1,000 questions the saving reaches 17x. The judge that routed the build ran on a hosted API, so its energy is not in these bars.</text>
</svg>