<text x="524" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11.5" font-weight="600" fill="#52514E" letter-spacing="0.3">TOTAL GPU ENERGY FOR THE RUN</text>
<text x="176" y="143" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" fill="#1A1A1A">full transcript</text>
