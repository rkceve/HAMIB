<text x="178" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11.5" fill="#52514E">diagram build (one-time)</text>
