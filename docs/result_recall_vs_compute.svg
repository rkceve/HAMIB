<svg xmlns="http://www.w3.org/2000/svg" width="960" height="398" viewBox="0 0 960 398" role="img" aria-label="Fact recall and total energy for a 96-question run. The full transcript answers 94 of 96 using 6.28 megajoules. The 32k correlation-diagram window answers 63 using 0.99 megajoules, of which 0.69 is the one-time cost of building the diagram.">
<rect width="960" height="398" fill="#FCFCFB"/>
<text x="28" y="36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="16" font-weight="600" fill="#1A1A1A">Fact recall and total energy, 96 questions over one 179,394-token session</text>
<text x="28" y="57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#52514E">Qwen3.8-27B, bf16, A100 80&#160;GB. The energy bars cover the WHOLE run: building the diagram once, plus reading it for all 96 questions.</text>
<text x="28" y="75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#52514E">The diagram rows saw no verbatim transcript at all.</text>
